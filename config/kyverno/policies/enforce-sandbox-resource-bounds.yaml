apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-sandbox-resource-bounds
  annotations:
    policies.kyverno.io/title: Enforce Sandbox Resource Bounds
    policies.kyverno.io/category: OpenShell Workload
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Sandbox
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
  variables:
    - name: containers
      expression: object.spec.podTemplate.spec.containers
    - name: boundedResources
      expression: "['cpu', 'memory', 'ephemeral-storage']"
    - name: maxLimits
      expression: "{'cpu': quantity('4'), 'memory': quantity('8Gi'), 'ephemeral-storage': quantity('20Gi')}"
    - name: allResourcesDeclared
      expression: >-
        variables.containers.all(c, variables.boundedResources.all(r,
          r in c.?resources.requests.orValue({}) &&
          r in c.?resources.limits.orValue({})))
  validations:
    - expression: variables.allResourcesDeclared
      message: Every sandbox container must declare CPU, memory, and ephemeral-storage requests and limits.
    - expression: >-
        !variables.allResourcesDeclared ||
        variables.containers.all(c, variables.boundedResources.all(r,
          !quantity(c.resources.requests[r]).isGreaterThan(quantity(c.resources.limits[r]))))
      message: Sandbox resource requests may not exceed their limits.
    - expression: >-
        !variables.allResourcesDeclared ||
        variables.containers.all(c, variables.boundedResources.all(r,
          !quantity(c.resources.limits[r]).isGreaterThan(variables.maxLimits[r])))
      message: A sandbox container may use at most 4 CPU, 8Gi memory, and 20Gi ephemeral storage.
