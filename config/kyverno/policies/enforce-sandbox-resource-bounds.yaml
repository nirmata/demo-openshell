apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-sandbox-resource-bounds
  annotations:
    policies.kyverno.io/title: Enforce Sandbox Resource Bounds
    policies.kyverno.io/category: OpenShell Workload
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Sandbox
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
  validations:
    - expression: >-
        object.spec.podTemplate.spec.containers.all(c,
          has(c.resources) &&
          has(c.resources.requests) &&
          has(c.resources.limits) &&
          'cpu' in c.resources.requests &&
          'memory' in c.resources.requests &&
          'ephemeral-storage' in c.resources.requests &&
          'cpu' in c.resources.limits &&
          'memory' in c.resources.limits &&
          'ephemeral-storage' in c.resources.limits)
      message: Every sandbox container must declare CPU, memory, and ephemeral-storage requests and limits.
    - expression: >-
        object.spec.podTemplate.spec.containers.all(c,
          quantity(c.resources.requests['cpu']).compareTo(quantity(c.resources.limits['cpu'])) <= 0 &&
          quantity(c.resources.requests['memory']).compareTo(quantity(c.resources.limits['memory'])) <= 0 &&
          quantity(c.resources.requests['ephemeral-storage']).compareTo(quantity(c.resources.limits['ephemeral-storage'])) <= 0)
      message: Sandbox resource requests may not exceed their limits.
    - expression: >-
        object.spec.podTemplate.spec.containers.all(c,
          quantity(c.resources.limits['cpu']).compareTo(quantity('4')) <= 0 &&
          quantity(c.resources.limits['memory']).compareTo(quantity('8Gi')) <= 0 &&
          quantity(c.resources.limits['ephemeral-storage']).compareTo(quantity('20Gi')) <= 0)
      message: A sandbox container may use at most 4 CPU, 8Gi memory, and 20Gi ephemeral storage.
