apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-sandbox-image-hygiene
  annotations:
    policies.kyverno.io/title: Enforce Sandbox Image Hygiene
    policies.kyverno.io/category: OpenShell Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Sandbox
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
  variables:
    - name: podSpec
      expression: object.spec.podTemplate.spec
    - name: allContainers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: digestReference
      expression: "'^.+@sha256:[0-9a-f]{64}$'"
  validations:
    - expression: variables.allContainers.all(c, c.image.matches(variables.digestReference))
      message: Sandbox images must use immutable sha256 digest references.
