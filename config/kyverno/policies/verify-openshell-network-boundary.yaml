apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: verify-openshell-network-boundary
  annotations:
    policies.kyverno.io/title: Verify OpenShell Network Boundary
    policies.kyverno.io/category: OpenShell Network
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: NetworkPolicy
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["networkpolicies"]
        resourceNames: ["openshell-sandbox-workloads"]
  variables:
    - name: boundaryRoleLabel
      expression: "'openshell.ai/boundary-role'"
    - name: policyTypes
      expression: object.spec.?policyTypes.orValue([])
    - name: ingressRules
      expression: object.spec.?ingress.orValue([])
    - name: ingressSources
      expression: "variables.ingressRules.size() == 1 ? variables.ingressRules[0].?from.orValue([]) : []"
    - name: ingressPorts
      expression: "variables.ingressRules.size() == 1 ? variables.ingressRules[0].?ports.orValue([]) : []"
  validations:
    - expression: >-
        object.spec.podSelector.?matchLabels[?variables.boundaryRoleLabel].orValue('') == 'workload'
      message: The workload fence must select only OpenShell workload Pods.
    - expression: >-
        'Ingress' in variables.policyTypes &&
        'Egress' in variables.policyTypes &&
        object.spec.?egress.orValue([]).size() == 0
      message: The workload fence must isolate both ingress and egress and may not allow direct workload egress.
    - expression: >-
        variables.ingressRules.size() == 1 &&
        variables.ingressSources.size() == 1 &&
        variables.ingressSources[0].?podSelector.matchLabels[?variables.boundaryRoleLabel].orValue('') == 'supervisor' &&
        variables.ingressPorts.size() == 1 &&
        variables.ingressPorts[0].?port.orValue(0) == 5500 &&
        variables.ingressPorts[0].?protocol.orValue('TCP') == 'TCP'
      message: Workload ingress must come only from OpenShell supervisors on TCP port 5500.
