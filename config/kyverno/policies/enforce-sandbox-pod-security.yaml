apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: enforce-sandbox-pod-security
  annotations:
    policies.kyverno.io/title: Enforce Sandbox Pod Security
    policies.kyverno.io/category: OpenShell Pod Security
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Sandbox
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
  variables:
    - name: podSpec
      expression: object.spec.podTemplate.spec
    - name: allContainers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: hostNamespaceFields
      expression: "['hostNetwork', 'hostPID', 'hostIPC', 'shareProcessNamespace']"
  validations:
    - expression: "!variables.hostNamespaceFields.exists(f, variables.podSpec[?f].orValue(false))"
      message: Sandbox workloads may not join host namespaces or share a process namespace.
    - expression: "!variables.podSpec.?automountServiceAccountToken.orValue(true)"
      message: Sandbox workloads may not mount a Kubernetes ServiceAccount token.
    - expression: variables.podSpec.?volumes.orValue([]).all(v, !has(v.hostPath) && !has(v.gitRepo))
      message: Sandbox workloads may not use hostPath or gitRepo volumes.
    - expression: >-
        variables.allContainers.all(c,
          c.?securityContext.runAsNonRoot.orValue(false) &&
          !c.?securityContext.allowPrivilegeEscalation.orValue(true) &&
          !c.?securityContext.privileged.orValue(false) &&
          'ALL' in c.?securityContext.capabilities.drop.orValue([]) &&
          c.?securityContext.capabilities.add.orValue([]).size() == 0)
      message: Every sandbox container must run as non-root, drop all capabilities, and disable privilege escalation.
    - expression: variables.podSpec.?securityContext.seccompProfile.type.orValue('') == 'RuntimeDefault'
      message: Sandbox workloads must use the RuntimeDefault seccomp profile.
