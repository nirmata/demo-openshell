apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: protect-sandbox-credentials
  annotations:
    policies.kyverno.io/title: Protect Sandbox Credentials
    policies.kyverno.io/category: OpenShell Credentials
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Sandbox
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
  variables:
    - name: podSpec
      expression: object.spec.podTemplate.spec
    - name: allContainers
      expression: >-
        variables.podSpec.containers +
        variables.podSpec.?initContainers.orValue([]) +
        variables.podSpec.?ephemeralContainers.orValue([])
    - name: injectsSecrets
      expression: >-
        variables.allContainers.exists(c,
          c.?envFrom.orValue([]).exists(e, has(e.secretRef)) ||
          c.?env.orValue([]).exists(e, e.?valueFrom.secretKeyRef.hasValue()))
    - name: projectsServiceAccountTokens
      expression: >-
        variables.podSpec.?volumes.orValue([]).exists(v,
          v.?projected.sources.orValue([]).exists(s, has(s.serviceAccountToken)))
  validations:
    - expression: "!variables.injectsSecrets"
      message: Use OpenShell providers instead of injecting Kubernetes Secrets into sandbox environment variables.
    - expression: "!variables.projectsServiceAccountTokens"
      message: Sandbox workloads may not receive projected Kubernetes ServiceAccount tokens.
