apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: protect-sandbox-credentials
  annotations:
    policies.kyverno.io/title: Protect Sandbox Credentials
    policies.kyverno.io/category: OpenShell Credentials
    policies.kyverno.io/severity: critical
    policies.kyverno.io/subject: Sandbox
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["sandboxes"]
  validations:
    - expression: >-
        object.spec.podTemplate.spec.containers.all(c,
          c.?envFrom.orValue([]).all(e, !has(e.secretRef)) &&
          c.?env.orValue([]).all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef))) &&
        object.spec.podTemplate.spec.?initContainers.orValue([]).all(c,
          c.?envFrom.orValue([]).all(e, !has(e.secretRef)) &&
          c.?env.orValue([]).all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef)))
      message: Use OpenShell providers instead of injecting Kubernetes Secrets into sandbox environment variables.
    - expression: >-
        object.spec.podTemplate.spec.?volumes.orValue([]).all(v,
          !has(v.projected) ||
          v.projected.?sources.orValue([]).all(s, !has(s.serviceAccountToken)))
      message: Sandbox workloads may not receive projected Kubernetes ServiceAccount tokens.
