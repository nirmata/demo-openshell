apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: default-sandbox-resources
  annotations:
    policies.kyverno.io/title: Default Sandbox Resources
    policies.kyverno.io/category: OpenShell Workload
    policies.kyverno.io/subject: Sandbox
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups: ["agents.x-k8s.io"]
        apiVersions: ["v1beta1"]
        operations: ["CREATE"]
        resources: ["sandboxes"]
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.spec.podTemplate.spec.containers[0].resources)
          ? []
          : [JSONPatch{
              op: "add",
              path: "/spec/podTemplate/spec/containers/0/resources",
              value: {
                "requests": {"cpu": "100m", "memory": "128Mi", "ephemeral-storage": "256Mi"},
                "limits": {"cpu": "1", "memory": "1Gi", "ephemeral-storage": "2Gi"}
              }
            }]
