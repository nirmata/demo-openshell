apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-openshell-rbac
  annotations:
    policies.kyverno.io/title: Restrict OpenShell RBAC
    policies.kyverno.io/category: OpenShell RBAC
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Role, ClusterRole
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ["rbac.authorization.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["roles", "clusterroles"]
  matchConditions:
    - name: openshell-role
      expression: object.metadata.name.startsWith('openshell-')
  variables:
    - name: rules
      expression: object.?rules.orValue([])
    - name: privilegeEscalationVerbs
      expression: "['bind', 'escalate', 'impersonate']"
  validations:
    - expression: >-
        variables.rules.all(r, !('*' in
          r.?apiGroups.orValue([]) +
          r.?resources.orValue([]) +
          r.?verbs.orValue([]) +
          r.?nonResourceURLs.orValue([])))
      message: OpenShell RBAC rules may not contain wildcards.
    - expression: >-
        variables.rules.all(r,
          !r.?verbs.orValue([]).exists(v, v in variables.privilegeEscalationVerbs))
      message: OpenShell RBAC rules may not grant bind, escalate, or impersonate.
